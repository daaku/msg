# Configuration of msg.service, read as its EnvironmentFile. It holds the
# bucket credentials: keep it readable by root only.

# External origin, as served by the proxy in front. It gives the passkey RP
# ID, so changing the host name later invalidates every passkey.
PUBLIC_URL=https://chat.example.com

# S3 compatible bucket.
S3_ENDPOINT=https://ACCOUNT_ID.r2.cloudflarestorage.com
S3_REGION=auto
S3_BUCKET=msg
S3_ACCESS_KEY_ID=
S3_SECRET_ACCESS_KEY=

# true: https://host/bucket/key. false: https://bucket.host/key (AWS S3).
#S3_PATH_STYLE=true

# Signed URL validity. 7d is the most AWS S3, R2 and MinIO accept.
#S3_URL_VALIDITY=7d

# Page titles, home screen name, passkey RP name.
#APP_NAME=msg

# Username of the bootstrap admin. Its sign up link is printed to the journal
# on start while there are no users.
#ADMIN_USERNAME=admin

# Largest accepted upload. KB, MB, GB, TB are binary.
#MAX_UPLOAD_SIZE=100MB

# Converted images: webp, avif or jpeg. Long edge: 4k, 1440p, 1080p, 720p, 480p.
#IMAGE_FORMAT=webp
#IMAGE_RESOLUTION=4k

# Converted videos: h264 or av1, in MP4 with AAC audio.
#VIDEO_FORMAT=h264
#VIDEO_RESOLUTION=1080p
